<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Kalkulator pasów</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#15191e;--ink:#f0f2f4;--mute:#9aa6b2;--line:#2e3741;--steel:#000;--field:#0a0c0f;--acc:#e4572e;--bad:#ff5a5a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.top{background:var(--steel);height:max(10px,env(safe-area-inset-top))}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;font-size:17px;margin-bottom:6px}
.field{margin-bottom:18px}
input{width:100%;font:600 24px system-ui,sans-serif;padding:12px 14px;min-height:58px;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input.bad{border-color:var(--bad);background:#3a1414;color:var(--bad)}
button{width:100%;font:700 22px system-ui,sans-serif;min-height:60px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.res{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.res label{color:var(--mute)}
.out{font:800 clamp(64px,22vw,96px)/1 system-ui,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="top"></div>
<main><form class="card" id="f" autocomplete="off">
 <div class="field"><label for="t">Grubość, mm</label><input id="t" inputmode="decimal" value="0"></div>
 <div class="field"><label for="w">Szerokość pasa, mm</label><input id="w" inputmode="decimal" value="0"></div>
 <button id="go" type="submit">Oblicz</button>
 <div class="res"><label>Ilość pasów</label><div class="out" id="n" aria-live="polite">0</div></div>
</form></main>
<script>
function combos(sizes,stock,t,cap){const res=[];const cur=new Array(sizes.length).fill(0);let over=false;
 (function rec(i,rem){if(over)return;if(rem===0){res.push(cur.slice());if(res.length>cap)over=true;return;}if(i===sizes.length)return;
  const s=sizes[i];const mx=Math.min(Math.floor(rem/s),stock[i]);
  for(let k=mx;k>=0;k--){cur[i]=k;rec(i+1,rem-k*s);}cur[i]=0;})(0,t);return {list:res,over};}
function lpMax(A,b,c){const m=A.length,n=c.length,W=n+m+1;const T=[];
 for(let i=0;i<m;i++){const r=new Float64Array(W);for(let j=0;j<n;j++)r[j]=A[i][j];r[n+i]=1;r[W-1]=b[i];T.push(r);}
 const z=new Float64Array(W);for(let j=0;j<n;j++)z[j]=-c[j];const basis=[...Array(m)].map((_,i)=>n+i);
 for(let it=0;it<20000;it++){let e=-1;for(let j=0;j<W-1;j++)if(z[j]<-1e-9){e=j;break;}if(e<0)break;
  let l=-1,best=Infinity;for(let i=0;i<m;i++)if(T[i][e]>1e-9){const q=T[i][W-1]/T[i][e];if(q<best-1e-12||(Math.abs(q-best)<=1e-12&&basis[i]<basis[l])){best=q;l=i;}}
  if(l<0)return {v:Infinity,x:new Float64Array(n)};const p=T[l][e];for(let j=0;j<W;j++)T[l][j]/=p;
  for(let i=0;i<m;i++)if(i!==l&&T[i][e]!==0){const f=T[i][e];for(let j=0;j<W;j++)T[i][j]-=f*T[l][j];}
  const f=z[e];for(let j=0;j<W;j++)z[j]-=f*T[l][j];basis[l]=e;}
 const x=new Float64Array(n);for(let i=0;i<m;i++)if(basis[i]<n)x[basis[i]]=T[i][W-1];return {v:z[W-1],x};}
function plan(sizes,stock,tA,tB,limit){
 const cA=combos(sizes,stock,tA,4000),cB=combos(sizes,stock,tB,4000);
 const A=cA.list,B=cB.list;if(!A.length||!B.length)return{N:0,proven:true,A,B};
 const k=sizes.length,nA=A.length,nB=B.length;
 const rows=[];for(let i=0;i<k;i++)rows.push([...A.map(c=>c[i]),...B.map(c=>c[i])]);
 rows.push([...A.map(()=>1),...B.map(()=>-1)]);
 const lp=lpMax(rows,[...stock,0],[...A.map(()=>1),...B.map(()=>0)]);
 let ub=Math.min(Math.floor(lp.v+1e-6),limit);
 const w=sizes.map((s,i)=>1/(stock[i]+0.5)),sc=c=>c.reduce((a,v,i)=>a+v*w[i],0);
 const pa=new Map(A.map((c,i)=>[c,lp.x[i]])),pb=new Map(B.map((c,i)=>[c,lp.x[nA+i]]));
 const orders=[[A.slice().sort((x,y)=>(pa.get(y)-pa.get(x))||sc(x)-sc(y)),B.slice().sort((x,y)=>(pb.get(y)-pb.get(x))||sc(x)-sc(y))],
  [A.slice().sort((x,y)=>sc(x)-sc(y)),B.slice().sort((x,y)=>sc(x)-sc(y))]];
 const t0=Date.now();let proven=true;
 for(let N=ub;N>0;N--){let allTo=true;for(const [A,B] of orders){const st=stock.slice(),pick=[],fail=new Set();let nodes=0,to=false;const dl=Date.now()+Math.max(250,1500-(Date.now()-t0)/6);
  const fits=c=>{for(let i=0;i<k;i++)if(c[i]>st[i])return false;return true};
  const dfs=(ra,rb,mi)=>{if(!ra&&!rb)return true;if(++nodes%4000===0&&Date.now()>dl)to=true;if(to)return false;
   let L=0;for(let i=0;i<k;i++)L+=st[i]*sizes[i];if(L<ra*tA+rb*tB)return false;
   const key=st.join()+'|'+ra+'|'+rb+'|'+mi;if(fail.has(key))return false;const Ls=ra?A:B;
   for(let j=mi;j<Ls.length;j++){const c=Ls[j];if(!fits(c))continue;for(let i=0;i<k;i++)st[i]-=c[i];pick.push(c);
    if(ra?dfs(ra-1,rb,ra>1?j:0):dfs(0,rb-1,j))return true;pick.pop();for(let i=0;i<k;i++)st[i]+=c[i];if(to)return false;}
   fail.add(key);return false};
  if(dfs(N,N,0))return{N,proven,ub,A:pick.slice(0,N),B:pick.slice(N),left:st,over:cA.over||cB.over};
  if(!to){allTo=false;break;}}
  if(allTo)proven=false;}
 return{N:0,proven,ub,A:[],B:[],left:stock.slice()};}
{
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzesP7VxMD2BvhvlW5OSOciHW9CfX_iFYT7mIju-CbSIHNBfmnnfx3cfAzkLcY9D3IQeg/exec';
const TOKEN='4c387b04332f6093';
const KNIFE=6,RUBBER=6,MAX_PASY=20,MAX_SZER=605;
const GAPS=[[0.3,0.7,0.1],[0.7,1.2,0.2],[1.2,1.7,0.3],[1.7,2.0,0.4]];
const DEF_RINGS=[[20,20],[10,20],[5,20],[4,21],[3,20],[2,23],[1.9,26],[1.8,25],[1.7,25],[1.6,25]];
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(String(v).replace(',','.').trim());return isFinite(x)?x:NaN};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let dev=ls.get('kp_dev',null);if(!dev){dev=Math.random().toString(36).slice(2,8);ls.set('kp_dev',dev)}
const rings=()=>{const r=ls.get('kp_rings',null);return Array.isArray(r)&&r.length?r:DEF_RINGS};
function gapFor(t){if(!(t>=0.3-1e-9&&t<=2.0+1e-9))return NaN;for(const g of GAPS)if(t>=g[0]-1e-9&&t<=g[1]+1e-9)return g[2];return NaN}
function call(params){if(!SCRIPT_URL)return Promise.reject('no url');const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),10000);
 const q=new URLSearchParams(Object.assign({token:TOKEN},params));
 return fetch(SCRIPT_URL+'?'+q,{signal:ctl.signal}).then(r=>r.json()).finally(()=>clearTimeout(tm))}
function syncRings(){call({action:'stock'}).then(d=>{if(d&&d.ok&&Array.isArray(d.rings)&&d.rings.length){ls.set('kp_rings',d.rings.filter(r=>r[0]>0&&r[1]>=0))}}).catch(()=>{})}
let sending=false;
function flush(){if(sending)return;const q=ls.get('kp_queue',[]);if(!q.length)return;sending=true;const batch=q.slice(0,15);
 call({action:'log',items:JSON.stringify(batch)}).then(d=>{if(d&&d.ok){const ids=new Set(batch.map(i=>i.id));ls.set('kp_queue',ls.get('kp_queue',[]).filter(i=>!ids.has(i.id)))}}).catch(()=>{}).finally(()=>{sending=false;if(ls.get('kp_queue',[]).length&&navigator.onLine)setTimeout(flush,1500)})}
function log(t,w,n){const q=ls.get('kp_queue',[]);q.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),t,w,n,dev});ls.set('kp_queue',q.slice(-500));flush()}
const T=$('t'),Wd=$('w'),out=$('n'),go=$('go');
function check(){const t=num(T.value);const badT=T.value.trim()!==''&&t!==0&&!isFinite(gapFor(t));T.classList.toggle('bad',badT);T.setAttribute('aria-invalid',badT);return !badT}
[T,Wd].forEach(el=>el.addEventListener('focus',()=>el.select()));
T.addEventListener('input',()=>{check();out.textContent='0'});Wd.addEventListener('input',()=>{Wd.classList.remove('bad');out.textContent='0'});
$('f').addEventListener('submit',e=>{e.preventDefault();
 const t=num(T.value),W=num(Wd.value),gap=gapFor(t);
 if(!isFinite(gap)){T.classList.add('bad');out.textContent='0';return}
 if(!(W>0)){Wd.classList.add('bad');out.textContent='0';return}
 go.disabled=true;go.textContent='Liczę…';
 setTimeout(()=>{let n=0;try{const O=W-2*RUBBER,I=W-2*KNIFE-gap;
   if(O>0&&I>0){const r=rings().filter(x=>x[0]>0&&x[1]>0).sort((a,b)=>b[0]-a[0]);
    const lim=Math.min(MAX_PASY,Math.floor(MAX_SZER/W+1e-9));
    n=lim>0?plan(r.map(x=>Math.round(x[0]*100)),r.map(x=>Math.floor(x[1])),Math.round(O*100),Math.round(I*100),lim).N:0}}catch(err){n=0}
  out.textContent=n;go.disabled=false;go.textContent='Oblicz';log(t,W,n)},30)});
window.addEventListener('online',()=>{syncRings();flush()});
syncRings();flush();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script></body></html>
